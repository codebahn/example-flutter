name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: codebahn-small

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter SDK
        run: |
          FLUTTER_VERSION="3.29.3"
          wget -qO flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf flutter.tar.xz -C /opt
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
